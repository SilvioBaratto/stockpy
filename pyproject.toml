[build-system]
requires = [
    "setuptools>=61.2",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "stockpy-learn"
version = "0.4.0"
description = "Time-series forecasting library using encoder-decoder neural architectures."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Silvio Baratto", email = "silvio.baratto22@gmail.com"},
]
keywords = ["time-series", "forecasting", "deep-learning", "pytorch", "encoder-decoder"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "pyro-ppl>=1.9.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "tqdm>=4.60.0",
    "matplotlib>=3.7.0",
    "pillow>=9.0.0",
    "scikit-learn>=1.3.0",
    "safetensors>=0.4.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "coverage>=7.0.0",
    "pycodestyle>=2.10.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "numpydoc>=1.6.0",
]

[project.urls]
Homepage = "https://github.com/SilvioBaratto/stockpy"
Documentation = "https://stockpy.readthedocs.io/"
Repository = "https://github.com/SilvioBaratto/stockpy"

[tool.setuptools]
packages = ["stockpy"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
stockpy = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["stockpy"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
